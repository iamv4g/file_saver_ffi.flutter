name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'screenshots/**']
  # No paths-ignore here: the jobs are required status checks, and a
  # skipped workflow would leave a docs-only PR waiting on them forever.
  pull_request:
  workflow_dispatch:
  # Lets publish.yml run the full CI before releasing a tag.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: cd example && flutter pub get

      - name: Check formatting (generated bindings excluded)
        run: |
          git ls-files -- 'lib/*.dart' 'tool/*.dart' 'test/*.dart' 'example/lib/*.dart' ':!:*.g.dart' \
            | xargs dart format --output=none --set-exit-if-changed

      - name: Analyze package
        run: flutter analyze --no-fatal-infos
      - name: Analyze example
        run: flutter analyze --no-fatal-infos
        working-directory: example

      - name: Validate package for pub.dev
        run: flutter pub publish --dry-run

  test:
    name: Test (${{ matrix.os }}, Flutter ${{ matrix.flutter }})
    needs: analyze
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        flutter: [stable]
        include:
          # Minimum version from pubspec.yaml `environment.flutter`.
          - os: ubuntu-latest
            flutter: 3.44.0
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          cache: true
      - run: flutter pub get
      - run: flutter test

  android-unit-test:
    name: Android unit tests
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The plugin's Gradle module is only buildable through the example app.
      - name: Generate the example's Gradle project
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --config-only

      - name: Run Kotlin unit tests (Robolectric)
        working-directory: example/android
        run: ./gradlew :file_saver_ffi:testDebugUnitTest

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: example/build/file_saver_ffi/reports/tests/testDebugUnitTest

  build:
    name: Build example (${{ matrix.target }}${{ matrix.ios-deps && format(', {0}', matrix.ios-deps) || '' }})
    needs: analyze
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: apk }
          - { os: ubuntu-latest, target: linux }
          - { os: ubuntu-latest, target: web }
          - { os: windows-latest, target: windows }
          - { os: macos-latest, target: macos }
          # The plugin ships both Package.swift and a podspec; build both.
          - { os: macos-latest, target: ios, ios-deps: swiftpm }
          - { os: macos-latest, target: ios, ios-deps: cocoapods }
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - if: matrix.target == 'apk'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - if: matrix.ios-deps == 'swiftpm'
        run: flutter config --enable-swift-package-manager
      - if: matrix.ios-deps == 'cocoapods'
        run: flutter config --no-enable-swift-package-manager

      - name: Build
        working-directory: example
        shell: bash
        run: |
          flutter pub get
          case "${{ matrix.target }}" in
            web) flutter build web ;;
            ios) flutter build ios --debug --no-codesign ;;
            *)   flutter build ${{ matrix.target }} --debug ;;
          esac
