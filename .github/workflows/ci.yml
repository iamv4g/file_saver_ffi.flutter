name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'screenshots/**']
  # No paths-ignore here: `CI result` is a required status check, and a
  # skipped workflow would leave a docs-only PR waiting for it forever.
  pull_request:
  workflow_dispatch:
  # Lets publish.yml run the full CI before releasing a tag.
  workflow_call:

# A new push cancels the run it supersedes, on a PR and on main alike: PRs are
# squash-merged, so the newest commit on main contains every commit before it,
# and the release runs CI again on the tagged commit. A manual run is never
# cancelled, and neither is the release (publish.yml calls this workflow with
# the tag as `github.ref`, so it has a group of its own).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  # Pull requests only run the platform jobs their changes need (see
  # tool/ci_changes.sh). Pushes to main, manual runs and the release run
  # everything. Analyze and the Ubuntu tests always run.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.scope.outputs.android }}
      darwin: ${{ steps.scope.outputs.darwin }}
      web: ${{ steps.scope.outputs.web }}
      test: ${{ steps.scope.outputs.test }}
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            git diff --name-only "$BASE...$HEAD" | tee /dev/stderr | bash tool/ci_changes.sh
          else
            bash tool/ci_changes.sh --all
          fi | tee -a "$GITHUB_OUTPUT"

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: cd example && flutter pub get

      - name: Check formatting (generated bindings excluded)
        run: |
          git ls-files -- 'lib/*.dart' 'tool/*.dart' 'test/*.dart' 'example/lib/*.dart' ':!:*.g.dart' \
            | xargs dart format --output=none --set-exit-if-changed

      - name: Analyze package
        run: flutter analyze
      - name: Analyze example
        run: flutter analyze
        working-directory: example

      - name: Validate package for pub.dev
        run: flutter pub publish --dry-run

  test:
    name: Test (${{ matrix.os }}, Flutter ${{ matrix.flutter }})
    needs: [changes, analyze]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu on stable and on the minimum Flutter version, always. macOS
        # and Windows when the change touches dart:io code whose behaviour
        # depends on the file system or OS, e.g.
        # [{"os": "ubuntu-latest", "flutter": "stable"}, ...].
        include: ${{ fromJSON(needs.changes.outputs.test) }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          cache: true
      - run: flutter pub get
      - run: flutter test

  android-unit-test:
    name: Android unit tests
    needs: [changes, analyze]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The plugin's Gradle module is only buildable through the example app.
      - name: Generate the example's Gradle project
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --config-only

      - name: Run Kotlin unit tests (Robolectric)
        working-directory: example/android
        run: ./gradlew :file_saver_ffi:testDebugUnitTest

      # Catches hand edits of the bindings, and a Kotlin API change without
      # regenerating them.
      - name: Check the JNI bindings match the Kotlin classes
        run: |
          flutter pub get
          dart run tool/jnigen.dart
          git diff --exit-code -- lib/src/platforms/android/bindings.g.dart \
            || { echo "::error::Run 'dart run tool/jnigen.dart' and commit lib/src/platforms/android/bindings.g.dart."; exit 1; }

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: example/build/file_saver_ffi/reports/tests/testDebugUnitTest

  # Apps made by `flutter create` (AGP 9, built-in Kotlin off) and apps still
  # on AGP 8 build the plugin's Kotlin differently from the example app, which
  # turns built-in Kotlin on.
  android-consumer:
    name: Build an app that uses the plugin (${{ matrix.name }})
    needs: [changes, analyze]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: flutter create
            args: ''
          - name: AGP 8
            args: 8.11.1 8.14.3 2.3.20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: bash tool/check_consumer_app.sh ${{ matrix.args }}

  web-test:
    name: Web tests (Chrome)
    needs: [changes, analyze]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The web tests need a browser; `flutter test` on the VM skips them.
      - name: Run web tests (dart2js)
        run: flutter test --platform chrome test/platforms/web
      - name: Run web tests (dart2wasm)
        run: flutter test --platform chrome --wasm test/platforms/web

  darwin-unit-test:
    name: Darwin unit tests
    needs: [changes, analyze]
    if: needs.changes.outputs.darwin == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Swift unit tests (XCTest)
        working-directory: darwin/file_saver_ffi
        run: swift test

      # Catches hand edits of the bindings, and a header change without
      # regenerating them. ffigen uses the libclang of Xcode.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check the FFI bindings match the C header
        run: |
          flutter pub get
          dart run tool/ffigen.dart
          git diff --exit-code -- lib/src/platforms/darwin/bindings.g.dart \
            || { echo "::error::Run 'dart run tool/ffigen.dart' and commit lib/src/platforms/darwin/bindings.g.dart."; exit 1; }

  build:
    name: Build example (${{ matrix.target }}${{ matrix.ios-deps && format(', {0}', matrix.ios-deps) || '' }})
    needs: [changes, analyze]
    if: needs.changes.outputs.build != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The targets whose native code the change touches, e.g.
        # [{"os": "ubuntu-latest", "target": "apk"}].
        include: ${{ fromJSON(needs.changes.outputs.build) }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - if: matrix.target == 'apk'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - if: matrix.ios-deps == 'swiftpm'
        run: flutter config --enable-swift-package-manager
      - if: matrix.ios-deps == 'cocoapods'
        run: flutter config --no-enable-swift-package-manager

      - name: Build
        working-directory: example
        shell: bash
        run: |
          flutter pub get
          case "${{ matrix.target }}" in
            # dart2wasm too: it compiles the conditional imports differently
            # (dart.library.html is false there).
            web) flutter build web && flutter build web --wasm ;;
            ios) flutter build ios --debug --no-codesign ;;
            # A release build, so R8 shrinks and renames the plugin with its
            # consumer rules, as it does in apps that use it.
            apk) flutter build apk --release ;;
            *)   flutter build ${{ matrix.target }} --debug ;;
          esac

      - name: Check the app bundles the plugin's privacy manifest
        if: matrix.target == 'ios' || matrix.target == 'macos'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            ios) app=example/build/ios/iphoneos/Runner.app ;;
            macos) app=example/build/macos/Build/Products/Debug/file_saver_ffi_example.app ;;
          esac
          bash tool/check_privacy_manifest.sh "$app"

      - name: Check the pod has the package version
        if: matrix.ios-deps == 'cocoapods'
        run: |
          pod=$(pod ipc spec darwin/file_saver_ffi.podspec | jq -r .version)
          package=$(sed -n 's/^version: *//p' pubspec.yaml)
          echo "pod $pod, package $package"
          [ "$pod" = "$package" ]

      - name: Check R8 kept every JNI lookup
        if: matrix.target == 'apk'
        run: |
          flutter pub get
          dart run tool/check_jni_keeps.dart example/build/app/outputs/flutter-apk/app-release.apk

  # The only check the main branch ruleset requires. Skipped jobs don't fail
  # it, so a pull request isn't blocked waiting for jobs it didn't need. A
  # skipped matrix job reports under its unexpanded name, so the ruleset
  # can't require the per-job names.
  result:
    name: CI result
    if: always()
    needs:
      - changes
      - analyze
      - test
      - android-unit-test
      - android-consumer
      - darwin-unit-test
      - web-test
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tool/ci_result.sh
          sparse-checkout-cone-mode: false
      # Fails unless every job succeeded, or was skipped because the change
      # doesn't need it. A job no runner picked up shows as `abandoned` here,
      # not `cancelled`, so nothing but success counts.
      - name: Check that every job the change needs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash tool/ci_result.sh <<<"$NEEDS"
