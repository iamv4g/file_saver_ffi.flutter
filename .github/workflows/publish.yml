name: Publish to pub.dev

# Release: merge a PR that bumps `version` in pubspec.yaml and adds a matching
# `## <version>` section to CHANGELOG.md, then push the tag from main:
#
#   git tag v0.10.1 && git push origin v0.10.1
#
# Running it manually, or from a PR that changes this file, performs a dry run:
# the release checks and full CI (which includes `pub publish --dry-run`) run,
# and the publish job is skipped.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-release:
    name: Check release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag matches pubspec version and is on main
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - name: CHANGELOG has a section for the version
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          if ! grep -qxF "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi

  ci:
    name: CI
    needs: check-release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: ci
    # pub.dev only accepts uploads from tag pushes.
    if: github.event_name == 'push'
    permissions:
      id-token: write # Required for OIDC authentication with pub.dev
    # Installs Flutter, runs `dart pub publish --dry-run`, then publishes.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      # Must match the environment required on the pub.dev admin page.
      environment: pub.dev
