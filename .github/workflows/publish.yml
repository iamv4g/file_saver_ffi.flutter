name: Publish to pub.dev

# Release: merge a PR that bumps `version` in pubspec.yaml and adds a matching
# `## <version>` section to CHANGELOG.md, then push the tag from main (or, for
# a patch of an older minor version, from its release/<major>.<minor> branch):
#
#   git tag v0.10.1 && git push origin v0.10.1
#
# pub.dev only accepts automated publishing from a workflow triggered by a tag
# push. The tag must match the pattern set on the package admin page
# (v{{version}}).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  check-release:
    name: Check release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # tool/ci_passed.sh lists the CI runs
    outputs:
      ci-passed: ${{ steps.ci-passed.outputs.passed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check tag, main and CHANGELOG
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version"
            exit 1
          fi
          # A patch for an older minor version comes from its release branch,
          # e.g. release/0.12.
          minor=$(cut -d. -f1,2 <<<"$version")
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            && ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/release/$minor"; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main or release/$minor"
            exit 1
          fi
          if ! grep -qxF "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
      # CI runs on every push to main and release/*, with every job, so the
      # tagged commit has usually passed already. Running it again only adds
      # time and the chance of a flaky failure.
      - name: Look for a CI run that passed on this commit
        id: ci-passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if bash tool/ci_passed.sh "$GITHUB_SHA"; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: check-release
    # Only when no CI run passed on the tagged commit.
    if: needs.check-release.outputs.ci-passed != 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: [check-release, ci]
    # Runs when CI passed now, or was skipped because it passed before.
    if: >-
      !cancelled() && needs.check-release.result == 'success'
      && (needs.ci.result == 'success'
          || (needs.ci.result == 'skipped' && needs.check-release.outputs.ci-passed == 'true'))
    runs-on: ubuntu-latest
    # pub.dev is configured to require this environment. Its protection rules
    # (required reviewers, tag policy) gate every publish.
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # OIDC token for pub.dev
    steps:
      - uses: actions/checkout@v5
      # Sets up the pub.dev OIDC token, which Flutter's pub also reads.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub publish --force
