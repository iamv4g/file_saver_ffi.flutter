analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
include: package:flutter_lints/flutter.yaml
# On top of flutter_lints. Left out: `close_sinks`, which can't see a sink
# ended by `cancel()`, `only_throw_errors`, since tests throw whatever object
# a fake is given, and `unnecessary_await_in_return`, which the linter has
# deprecated ("following this lint rule everywhere ... can lead to unexpected
# errors"; the analyzer warns when it is enabled for Dart 3.13 code).
linter:
  rules:
    - avoid_dynamic_calls
    - avoid_void_async
    - cancel_subscriptions
    # A Future that is meant to run on its own is wrapped in `unawaited`.
    - discarded_futures
    - prefer_final_locals
    - unawaited_futures
