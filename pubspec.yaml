name: file_saver_ffi
description: "Save bytes, files and downloads to the gallery, device storage or a user-picked folder, with progress, cancellation and conflict handling. Native FFI and JNI on mobile."
version: 0.12.0
homepage: https://github.com/iamv4g/file_saver_ffi.flutter
repository: https://github.com/iamv4g/file_saver_ffi.flutter
issue_tracker: https://github.com/iamv4g/file_saver_ffi.flutter/issues
topics:
  - file-saver
  - gallery-saver
  - saver
  - ffi
  - jni

screenshots:
  - description: "File Saver Ffi"
    path: screenshots/thumbnail.jpg

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  ffi: ^2.2.0
  jni: ^1.0.0
  path: ^1.9.1
  path_provider_windows: ^2.3.0
  dir_picker: ^0.8.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^20.1.1
  jnigen: ^0.17.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
        package: com.iamv4g.file_saver_ffi
        pluginClass: FileSaverFfiPlugin
        dartPluginClass: FileSaverAndroid
      ios:
        ffiPlugin: true
        sharedDarwinSource: true
        dartPluginClass: FileSaverDarwin
      macos:
        ffiPlugin: true
        sharedDarwinSource: true
        dartPluginClass: FileSaverDarwin
      windows:
        dartPluginClass: FileSaverWindows
      linux:
        dartPluginClass: FileSaverLinux
      web:
        pluginClass: FileSaverWeb
        fileName: file_saver_ffi.dart
