// Built by the app that uses the plugin, with that app's Android Gradle Plugin
// (8 or 9). The plugin doesn't apply the Kotlin Gradle Plugin: AGP 9's
// built-in Kotlin compiles the Kotlin sources, or Flutter applies KGP when
// built-in Kotlin is off. tool/check_consumer_app.sh builds both setups.

group = "com.iamv4g.file_saver_ffi"
version = "1.0"

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.iamv4g.file_saver_ffi"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
        consumerProguardFiles 'proguard-rules.pro'
    }

    // JVM unit tests in src/test, run with Robolectric. From example/android:
    //   ./gradlew :file_saver_ffi:testDebugUnitTest
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.activity:activity-ktx:1.11.0"
    implementation "androidx.documentfile:documentfile:1.1.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    testImplementation "org.robolectric:robolectric:4.17"
    testImplementation "androidx.test:core:1.7.0"
    // HttpURLConnection backed by OkHttp in network tests, as on Android (the
    // JDK implementation behaves differently, e.g. on disconnect()).
    testImplementation "com.squareup.okhttp3:okhttp-urlconnection:3.12.13"
}